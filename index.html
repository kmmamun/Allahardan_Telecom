function applyLang(){
  const en=LANG==='en',w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){
    const v=n.nodeValue,p=n.parentNode&&n.parentNode.nodeName;
    if(!/\S/.test(v)||p==='SCRIPT'||p==='STYLE')continue;
    if(n.__o===undefined||(n.__t!==undefined&&v!==n.__t))n.__o=v;
    const o=n.__o,nv=o.match(/^\s*/)[0]+(en?tr(o.trim()):o.trim())+o.match(/\s*$/)[0];
    if(v!==nv)n.nodeValue=nv;n.__t=nv;
  }
  document.querySelectorAll('[placeholder]').forEach(e=>{if(e.dataset.ph===undefined)e.dataset.ph=e.placeholder;e.placeholder=en?tr(e.dataset.ph):e.dataset.ph});
}

// লেখা: সার্ভারের উত্তর পড়ে নিশ্চিত হয় (নিশ্চিত না হওয়া পর্যন্ত এন্ট্রি ফোনে জমা থাকে ও বারবার চেষ্টা হয়)
function send(p){return new Promise(res=>{
  const cb='jw'+Math.random().toString(36).slice(2),s=document.createElement('script');let got=false;
  const end=r=>{clearTimeout(tm);delete window[cb];s.remove();res(r)};
  const tm=setTimeout(()=>end({ok:false,m:'net'}),25000);
  window[cb]=r=>{got=true;end(r&&r.status==='success'?{ok:true}:{ok:false,m:(r&&r.message)||'error'})};
  s.onerror=()=>end({ok:false,m:'net'});
  s.onload=()=>{if(!got)end({ok:false,m:'access'})};
  s.src=URL_+'?action=write&callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(p))+'&_='+Date.now();
  document.body.appendChild(s);
})}
async function flush(){
  if(flush.busy)return; flush.busy=true;
  for(const q of Q.filter(x=>!x.ok)){
    const {t,ok,...p}=q, r=await send(p);
    if(r.ok){q.ok=Date.now();saveQ();lastErr='';toast('Excel এ সেভ হয়েছে ✓')}else{lastErr=r.m;break}
  }
  flush.busy=false;warn();
}
function warn(){
  const n=Q.filter(x=>!x.ok).length,w=$('warn');

  const h=lastErr==='access'?'Apps Script → Deploy → Manage deployments → "Who has access" = Anyone করে New version ডিপ্লয় করুন':lastErr==='net'?'ইন্টারনেট বা Apps Script লিংকে সংযোগ হচ্ছে না':/Invalid Action/.test(lastErr)?'Code.gs এর নতুন ভার্সন Apps Script এ পেস্ট করে New version ডিপ্লয় করুন':lastErr;

// সার্ভারের ডাটার উপর এখনো না-পৌঁছানো এন্ট্রিগুলো বসিয়ে দেয়, যাতে স্ক্রিন থেকে কিছু হারিয়ে না যায়
function reconcile(srv){
  const keep=[];
  Q.forEach(q=>{
    const rows=srv[q.sheet]; if(!rows)return;
    const aged=q.ok&&Date.now()-q.ok>12e4,row=rows.find(x=>String(x.ID)===String(q.action==='add'?q.row.ID:q.id));
    if(q.action==='delete'){
      if(!row||aged)return;
      rows.splice(rows.indexOf(row),1);
      if(q.sheet==='Sales'&&row.ProductID){const p=srv.Products.find(x=>String(x.ID)===String(row.ProductID));if(p)p.Stock=num(p.Stock)+num(row.Qty)}
      keep.push(q);return;
    }
    if(q.action==='add'){
      if(row||aged)return;
      rows.push(q.row);
      if(q.sheet==='Sales'&&q.row.ProductID){const p=srv.Products.find(x=>String(x.ID)===String(q.row.ProductID));if(p)p.Stock=num(p.Stock)-num(q.row.Qty)}
      keep.push(q);
    }else if(row&&!aged&&!Object.keys(q.fields).every(k=>String(row[k]??'')===String(q.fields[k]??''))){Object.assign(row,q.fields);keep.push(q)}
  });
  Q=keep;saveQ();
}

}

function stockFix(o,n){
  const op=String(o.ProductID||''),np=String(n.ProductID!==undefined?n.ProductID:op),oq=num(o.Qty),nq=n.Qty!==undefined?num(n.Qty):oq,g=id=>S.Products.find(x=>String(x.ID)===id);
  if(op===np){const p=g(op);if(p)p.Stock=num(p.Stock)+oq-nq}else{const a=g(op),b=g(np);if(a)a.Stock=num(a.Stock)+oq;if(b)b.Stock=num(b.Stock)-nq}
}
function saveEdit(e){
  const v=Object.fromEntries(new FormData(e.target)),sh=SH[cur],r=S[sh].find(x=>String(x.ID)===String(EID));if(!r)return closeSheet();
  let f;
  if(cur==='Sale'){
    const p=S.Products.find(x=>String(x.Name).trim().toLowerCase()===String(v.Product).trim().toLowerCase()),q=num(v.Qty)||1,tot=q*num(v.UnitPrice);
    const same=String(v.Product).trim()===String(r.ProductName).trim()&&num(r.Qty)>0,uc=same?num(r.BuyCost)/num(r.Qty):(p?num(p.BuyPrice):0),cost=uc*q;
    f={ProductID:same?r.ProductID:(p?p.ID:''),ProductName:v.Product,Qty:q,UnitPrice:num(v.UnitPrice),Total:tot,BuyCost:cost,Profit:tot-cost,Customer:v.Customer,Phone:v.Phone,Paid:v.Paid===''?tot:num(v.Paid),Date:v.Date};

  const L=(a,b,bold)=>`<div style="display:flex;justify-content:space-between;padding:2px 0;${bold?'font-weight:700;font-size:15px':''}"><span>${a}</span><span>${b}</span></div>`;
  $('memo').innerHTML=`<div style="max-width:380px;margin:0 auto;font-family:'Noto Sans Bengali',Inter,sans-serif;color:#000;font-size:13px">
   <div style="text-align:center"><div style="font-size:20px;font-weight:700">${esc(SHOP.name)}</div><div>${esc(SHOP.tag)}</div>${[SHOP.addr,SHOP.phone].filter(Boolean).map(x=>`<div>${esc(x)}</div>`).join('')}<div style="margin-top:6px;font-weight:700;border:1px solid #000;display:inline-block;padding:2px 10px">${sv?'সার্ভিস মেমো':'ক্যাশ মেমো'}</div></div>
   <div style="margin:10px 0;line-height:1.6">নং: ${esc(r.ID)}<br>তারিখ: ${esc(toKey(r.Date))}<br>কাস্টমার: ${esc(r.Customer||'—')}${r.Phone?' · '+esc(r.Phone):''}${sv?`<br>অবস্থা: ${st}`:''}</div>
   <table style="width:100%;border-collapse:collapse"><tr style="border-bottom:1px solid #000">${head}</tr>${body}</table>
   <div style="margin-top:8px">${L('মোট',taka(tot),1)}${L('জমা',taka(paid))}${L('বাকি',taka(due),due>0)}</div>
   <div style="display:flex;justify-content:space-between;margin-top:36px;font-size:11px"><span style="border-top:1px solid #000;padding-top:3px">কাস্টমারের স্বাক্ষর</span><span style="border-top:1px solid #000;padding-top:3px">বিক্রেতার স্বাক্ষর</span></div>
   <div style="text-align:center;margin-top:14px;font-size:11px">${sv?'ডিভাইস ফেরত নেওয়ার সময় এই মেমো দেখাবেন। ':''}ধন্যবাদ!</div></div>`;
  setTimeout(()=>print(),200);
}
// কাস্টমার তালিকা: ফোন থাকলে ফোন দিয়ে, না থাকলে নাম দিয়ে মেলানো হয়
let custF='all',CL=[];
function custs(){
  const ph={},m={};
  S.Sales.concat(S.Services).forEach(r=>{const n=String(r.Customer||'').trim().toLowerCase(),p=String(r.Phone||'').trim();if(n&&p&&!ph[n])ph[n]=p});
  const add=(r,a,sh,t)=>{const nm=String(r.Customer||'').trim(),p=String(r.Phone||'').trim()||ph[nm.toLowerCase()]||'';if(!nm&&!p)return;
    const k=p||nm.toLowerCase(),c=m[k]||(m[k]={name:'',phone:'',n:0,tot:0,paid:0,due:0,last:'',h:[]});
    if(nm&&!c.name)c.name=nm;if(p)c.phone=p;c.n++;c.tot+=a;c.paid+=num(r.Paid);c.due+=Math.max(0,a-num(r.Paid));
    const d=toKey(r.Date);if(d>c.last)c.last=d;c.h.push({sh,id:r.ID,t,a,p:num(r.Paid),d})};
  S.Sales.forEach(r=>add(r,num(r.Total),'Sales',r.ProductName));S.Services.forEach(r=>add(r,num(r.Charge),'Services',r.Device));
  return Object.values(m).map(c=>(c.h.sort((x,y)=>y.d.localeCompare(x.d)),c)).sort((a,b)=>b.due-a.due||b.last.localeCompare(a.last));
}
function rCust(){
  if(!$('cust'))return;
  const all=custs(),q=($('cq').value||'').toLowerCase();
  CL=all.filter(c=>(custF==='all'||c.due>0)&&(c.name+' '+c.phone).toLowerCase().includes(q));
  $('cust-n').textContent=bn(all.length);$('cust-due').textContent=taka(all.reduce((s,c)=>s+c.due,0));
  $('cust-chips').innerHTML=[['all','সব',all.length],['due','বাকি আছে',all.filter(c=>c.due>0).length]].map(([k,t,n])=>`<button onclick="custF='${k}';rCust()" class="shrink-0 px-4 py-1.5 rounded-full text-sm font-medium ${custF===k?'bg-brandSky text-white':'card text-slate-600 dark:text-slate-300'}">${t} <span class="text-xs opacity-70">${bn(n)}</span></button>`).join('');
  $('cust').innerHTML=CL.length?CL.map((c,i)=>`<div onclick="custOpen(${i})" class="card rounded-2xl p-3 shadow-sm flex items-center gap-3 cursor-pointer"><span class="w-10 h-10 shrink-0 rounded-full bg-sky-100 dark:bg-sky-500/20 text-brandSky font-bold flex items-center justify-center">${esc((c.name||'#').slice(0,1).toUpperCase())}</span><div class="flex-1 min-w-0"><p class="font-semibold text-sm truncate">${esc(c.name||c.phone)}</p><p class="text-[11px] text-slate-400 truncate">${esc(c.phone)} · ${bn(c.n)} বার · ${esc(c.last)}</p></div><div class="text-right"><p class="font-bold text-sm">${taka(c.tot)}</p>${c.due>0?`<p class="text-[11px] text-red-500 font-semibold">বাকি ${taka(c.due)}</p>`:'<p class="text-[11px] text-emerald-600">পরিশোধিত</p>'}</div></div>`).join(''):`<p class="text-center text-slate-400 text-sm py-10 md:col-span-2">কোনো কাস্টমার নেই। বিক্রি বা সার্ভিসে নাম/ফোন দিলে এখানে আসবে।</p>`;
}
function custOpen(i){
  const c=CL[i];if(!c)return;
  $('seg').innerHTML=`<p class="font-bold text-brandBlue dark:text-white px-2 py-1.5 truncate">${esc(c.name||c.phone)}</p>`;
  $('form').innerHTML=`<div class="flex gap-2">${c.phone?`<a href="tel:${esc(c.phone)}" class="flex-1 text-center py-2 rounded-xl bg-emerald-100 text-emerald-700 font-semibold text-sm"><i class="fa-solid fa-phone mr-1"></i>${esc(c.phone)}</a>`:''}<div class="flex-1 text-center py-2 rounded-xl ${c.due>0?'bg-red-100 text-red-600':'bg-slate-100 dark:bg-slate-900'} font-semibold text-sm">বাকি ${taka(c.due)}</div></div>`
   +c.h.map(h=>`<div onclick="act('${h.sh}','${h.id}')" class="flex justify-between items-center gap-2 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 text-sm cursor-pointer"><span class="min-w-0"><b class="block truncate">${esc(h.t)}</b><span class="text-[11px] text-slate-400">${esc(h.d)}</span></span><span class="text-right shrink-0">${taka(h.a)}${h.a>h.p?`<span class="block text-[11px] text-red-500">বাকি ${taka(h.a-h.p)}</span>`:''}</span></div>`).join('');
  $('bd').classList.remove('hidden');requestAnimationFrame(()=>$('sheet').classList.add('open'));
}
function csv(){
  const rows=[['নাম','ফোন','লেনদেন','মোট বিল','জমা','বাকি','শেষ তারিখ']].concat(custs().map(c=>[c.name,c.phone,c.n,c.tot,c.paid,c.due,c.last]));
  const t='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='customers-'+dkey(new Date())+'.csv';a.click();
}

/* ---------- Nav / UI ---------- */
document.addEventListener('click',e=>{const d=$('pdd');if(d&&!e.target.closest('#pdd,#pdd-btn')&&e.target.name!=='Product')d.classList.add('hidden')});
const NAV=[['home','হোম','fa-house'],['service','সার্ভিস','fa-screwdriver-wrench'],['cust','কাস্টমার','fa-address-book'],['fab'],['stock','স্টক','fa-boxes-stacked'],['report','রিপোর্ট','fa-chart-pie']];
$('navi').innerHTML=NAV.map(n=>n[0]==='fab'?`<div class="flex justify-center md:order-first md:mb-3"><button onclick="openSheet('Sale')" class="-mt-8 md:mt-0 w-14 h-14 md:w-full md:h-11 rounded-full md:rounded-xl bg-brandSky text-white shadow-lg shadow-sky-500/40 flex items-center justify-center gap-2 text-2xl md:text-sm md:font-semibold border-4 md:border-0 border-slate-50 dark:border-slate-900"><i class="fa-solid fa-plus"></i><span class="hidden md:inline">নতুন এন্ট্রি</span></button></div>`:`<button data-nav="${n[0]}" onclick="go('${n[0]}')" class="flex flex-col md:flex-row items-center md:gap-3 md:px-3 md:py-2.5 md:rounded-xl gap-0.5 text-xs md:text-sm text-slate-400"><i class="fa-solid ${n[2]} text-lg md:w-5"></i>${n[1]}</button>`).join('');
function go(v){view=v;['home','service','cust','stock','report'].forEach(x=>$('v-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('[data-nav]').forEach(b=>{const on=b.dataset.nav===v;b.classList.toggle('nav-on',on)});$('vt').textContent=({home:'ড্যাশবোর্ড',service:'সার্ভিস',cust:'কাস্টমার',stock:'স্টক',report:'রিপোর্ট'})[v];scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){period=b.dataset.p;ptabs();rHome();rReport();rCharts()}});
$('quick').innerHTML=[['Sale','fa-cart-shopping','bg-orange-100 dark:bg-orange-500/20 text-brandOrange','মালামাল'],['Service','fa-screwdriver-wrench','bg-sky-100 dark:bg-sky-500/20 text-brandSky','সার্ভিস'],['Income','fa-plus','bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600','অন্য আয়'],['Expense','fa-minus','bg-red-100 dark:bg-red-500/20 text-red-500','ব্যয়']].map(q=>`<button onclick="openSheet('${q[0]}')" class="card rounded-2xl py-3 shadow-sm flex flex-col items-center gap-1.5"><span class="w-10 h-10 rounded-full flex items-center justify-center ${q[2]}"><i class="fa-solid ${q[1]}"></i></span><span class="text-[11px] font-medium">${q[3]}</span></button>`).join('');
function dark(){const on=document.documentElement.classList.toggle('dark');$('dk').className='fa-solid text-sm '+(on?'fa-sun':'fa-moon');try{localStorage.setItem('at-dark',on?'1':'0')}catch(e){}}
try{if(localStorage.getItem('at-dark')==='1')dark()}catch(e){}

/* ---------- PWA ---------- */
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').classList.remove('hidden')});
$('install').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('install').classList.add('hidden')};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));

go('home');render();applyLang();flush();fetchData();
setInterval(refresh,30000);setInterval(flush,10000);
document.addEventListener('visibilitychange',refresh);
addEventListener('online',refresh);
</script>
