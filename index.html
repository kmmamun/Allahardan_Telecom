<script>
const URL_ = "https://script.google.com/macros/s/AKfycbzU7OeSZMRgEC-WscE9q_Ef2Oqa0AiFrLQLe3SJjTV-ysAujzg78s4fkYIM03zM0rWi/exec";
const $ = id => document.getElementById(id);
const bn = n => Number(n || 0).toLocaleString('bn-BD', { maximumFractionDigits: 2 });
const taka = n => '৳ ' + bn(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const toKey = v => !v ? '' : (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v.trim())) ? v.trim() : (isNaN(new Date(v)) ? '' : dkey(v));
const num = v => Number(v) || 0;
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2000)}

let S = {Products:[],Sales:[],Services:[],Ledger:[]};
try { S = JSON.parse(localStorage.getItem('at-data')) || S; } catch(e){}
let period='today', chip='all', view='home', svcF='all';
const save = () => { try { localStorage.setItem('at-data', JSON.stringify(S)); } catch(e){} };

/* ---------- Data (নিঃশব্দে অটো আপডেট) ---------- */
// অফলাইনে/নেট সমস্যায় করা এন্ট্রি Q তে জমা থাকে এবং নেট এলে নিজে থেকেই সার্ভারে চলে যায়
let Q=[]; try{Q=JSON.parse(localStorage.getItem('at-q'))||[]}catch(e){}
const saveQ=()=>{try{localStorage.setItem('at-q',JSON.stringify(Q))}catch(e){}};

let lastErr='';
// লেখা: সার্ভারের উত্তর পড়ে নিশ্চিত হয় (নিশ্চিত না হওয়া পর্যন্ত এন্ট্রি ফোনে জমা থাকে ও বারবার চেষ্টা হয়)
function send(p){return new Promise(res=>{
  const cb='jw'+Math.random().toString(36).slice(2),s=document.createElement('script');let got=false;
  const end=r=>{clearTimeout(tm);delete window[cb];s.remove();res(r)};
  const tm=setTimeout(()=>end({ok:false,m:'net'}),25000);
  window[cb]=r=>{got=true;end(r&&r.status==='success'?{ok:true}:{ok:false,m:(r&&r.message)||'error'})};
  s.onerror=()=>end({ok:false,m:'net'});
  s.onload=()=>{if(!got)end({ok:false,m:'access'})};
  s.src=URL_+'?action=write&callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(p))+'&_='+Date.now();
  document.body.appendChild(s);
})}
async function flush(){
  if(flush.busy)return; flush.busy=true;
  for(const q of Q.filter(x=>!x.ok)){
    const {t,ok,...p}=q, r=await send(p);
    if(r.ok){q.ok=Date.now();saveQ();lastErr='';toast('Excel এ সেভ হয়েছে ✓')}else{lastErr=r.m;break}
  }
  flush.busy=false;warn();
}
function warn(){
  const n=Q.filter(x=>!x.ok).length,w=$('warn');
  if(!n||!lastErr){w.classList.add('hidden');return}
  const h=lastErr==='access'?'Apps Script → Deploy → Manage deployments → "Who has access" = Anyone করে New version ডিপ্লয় করুন':lastErr==='net'?'ইন্টারনেট বা Apps Script লিংকে সংযোগ হচ্ছে না':/Invalid Action/.test(lastErr)?'Code.gs এর নতুন ভার্সন Apps Script এ পেস্ট করে New version ডিপ্লয় করুন':lastErr;
  $('warn-t').textContent=bn(n)+'টি এন্ট্রি Excel এ যায়নি (ফোনে সেভ আছে, নিজে থেকে আবার চেষ্টা হবে)';$('warn-m').textContent=h;w.classList.remove('hidden');
}
const post = b => {Q.push(Object.assign({t:Date.now()},b));saveQ();flush()};

// সার্ভারের ডাটার উপর এখনো না-পৌঁছানো এন্ট্রিগুলো বসিয়ে দেয়, যাতে স্ক্রিন থেকে কিছু হারিয়ে না যায়
function reconcile(srv){
  const keep=[];
  Q.forEach(q=>{
    const rows=srv[q.sheet]; if(!rows)return;
    const aged=q.ok&&Date.now()-q.ok>12e4,row=rows.find(x=>String(x.ID)===String(q.action==='add'?q.row.ID:q.id));
    if(q.action==='add'){
      if(row||aged)return;
      rows.push(q.row);
      if(q.sheet==='Sales'&&q.row.ProductID){const p=srv.Products.find(x=>String(x.ID)===String(q.row.ProductID));if(p)p.Stock=num(p.Stock)-num(q.row.Qty)}
      keep.push(q);
    }else if(row&&!aged&&!Object.keys(q.fields).every(k=>String(row[k]??'')===String(q.fields[k]??''))){Object.assign(row,q.fields);keep.push(q)}
  });
  Q=keep;saveQ();
}

let busy=false;
function fetchData(){
  if(busy)return; busy=true;
  const cb='jp'+Date.now(), s=document.createElement('script');
  const clean=()=>{busy=false;clearTimeout(tm);s.remove()};
  const tm=setTimeout(()=>{window[cb]=()=>{};clean()},20000);
  window[cb]=r=>{clean();delete window[cb];
    if(r&&r.status==='success'){
      const srv={Products:r.products||[],Sales:r.sales||[],Services:r.services||[],Ledger:r.ledger||[]};
      reconcile(srv);S=srv;save();render();
    }else console.warn('ডাটা লোড ত্রুটি:',r&&r.message)};
  s.onerror=()=>{clean();delete window[cb];console.warn('ডাটা লোড হয়নি (নেট/ডিপ্লয়মেন্ট)')};
  s.src=URL_+'?action=getData&callback='+cb+'&_='+Date.now();
  document.body.appendChild(s);
}
const later = () => setTimeout(fetchData, 3000);
const refresh = () => {if(!document.hidden){flush();fetchData()}};

function txs(){
  const a=[];
  S.Sales.forEach(r=>a.push({k:'Sale',t:(r.ProductName||'বিক্রি')+(num(r.Qty)>1?' ×'+r.Qty:''),a:num(r.Total),p:num(r.Paid),d:toKey(r.Date),id:r.ID,sh:'Sales',pr:num(r.Profit)}));
  S.Services.forEach(r=>a.push({k:'Service',t:(r.Device||'সার্ভিস')+(r.Customer?' · '+r.Customer:''),a:num(r.Charge),p:num(r.Paid),d:toKey(r.Date),id:r.ID,sh:'Services',pr:num(r.Profit)}));
  S.Ledger.forEach(r=>{const e=r.Type==='Expense';a.push({k:e?'Expense':'Income',t:(r.Category||'')+(r.Note?' · '+r.Note:''),a:num(r.Amount),p:num(r.Amount),d:toKey(r.Date),id:r.ID})});
  return a.sort((x,y)=>y.d.localeCompare(x.d)||(parseInt(String(y.id).slice(2))||0)-(parseInt(String(x.id).slice(2))||0));
}
function inP(t){const n=dkey(new Date());return period==='all'||(period==='today'?t.d===n:t.d.slice(0,7)===n.slice(0,7))}

/* ---------- Render ---------- */
const META={
 Sale:{l:'মালামাল',i:'fa-cart-shopping',c:'bg-orange-100 dark:bg-orange-500/20 text-brandOrange',a:'text-emerald-600',s:'+'},
 Service:{l:'সার্ভিস',i:'fa-screwdriver-wrench',c:'bg-sky-100 dark:bg-sky-500/20 text-brandSky',a:'text-emerald-600',s:'+'},
 Income:{l:'অন্য আয়',i:'fa-arrow-down',c:'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600',a:'text-emerald-600',s:'+'},
 Expense:{l:'ব্যয়',i:'fa-arrow-up',c:'bg-red-100 dark:bg-red-500/20 text-red-500',a:'text-red-500',s:'-'}};
const PL={today:'আজ',month:'এই মাস',all:'সব'};
function render(){ptabs();rHome();rService();rStock();rReport();rCharts();$('plist').innerHTML=S.Products.map(p=>`<option value="${esc(p.Name)}">`).join('')}
function ptabs(){document.querySelectorAll('.ptabs').forEach(el=>{const hero=el.closest('.hero');el.innerHTML=Object.keys(PL).map(k=>`<button data-p="${k}" class="flex-1 py-1.5 rounded-full font-medium ${period===k?'bg-white text-brandBlue shadow':hero?'text-white/90':'text-slate-500'}">${PL[k]}</button>`).join('')})}
function rHome(){
  const all=txs(), rows=all.filter(inP);
  let i=0,o=0;rows.forEach(t=>t.k==='Expense'?o+=t.a:i+=t.p);
  $('bal').textContent=taka(i-o);$('s-in').textContent=taka(i);$('s-out').textContent=taka(o);
  $('plabel').textContent=({today:'আজকের',month:'এই মাসের',all:'মোট'})[period]+' নগদ ব্যালেন্স';
  $('s-due').textContent=taka(all.filter(t=>t.sh).reduce((s,t)=>s+Math.max(0,t.a-t.p),0));
  const def=[['all','সব'],['Sale','মালামাল'],['Service','সার্ভিস'],['Expense','ব্যয়'],['Income','অন্য আয়']];
  $('chips').innerHTML=def.map(([k,l])=>{const n=k==='all'?rows.length:rows.filter(t=>t.k===k).length,on=chip===k;return `<button onclick="chip='${k}';rHome()" class="shrink-0 px-4 py-1.5 rounded-full text-sm font-medium ${on?'bg-brandSky text-white shadow':'card text-slate-600 dark:text-slate-300'}">${l} <span class="text-xs ${on?'text-white/80':'text-slate-400'}">${bn(n)}</span></button>`}).join('');
  const f=rows.filter(t=>chip==='all'||t.k===chip);
  $('strip').innerHTML=`<span>${chip==='all'?'সব লেনদেন':META[chip].l}</span><span class="text-brandBlue dark:text-sky-300">মোট ${taka(f.reduce((s,t)=>s+t.a,0))} · ${bn(f.length)}টি</span>`;
  $('txs').innerHTML=f.length?f.slice(0,80).map(t=>{const m=META[t.k],due=t.sh?t.a-t.p:0;
   return `<div class="card rounded-2xl p-3 shadow-sm flex items-center gap-3"><span class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center ${m.c}"><i class="fa-solid ${m.i}"></i></span><div class="flex-1 min-w-0"><p class="font-semibold text-sm truncate">${esc(t.t)}</p><p class="text-[11px] text-slate-400 truncate">${esc(t.d)} · ${m.l}${due>0?` · <button class="text-red-500 font-semibold" onclick="collect('${t.sh}','${t.id}')">বাকি ${taka(due)} – আদায়</button>`:''}</p></div><span class="font-bold ${m.a}">${m.s}${taka(t.k==='Expense'?t.a:t.p)}</span></div>`}).join(''):`<p class="text-center text-slate-400 text-sm py-10"><i class="fa-regular fa-folder-open text-3xl block mb-2"></i>কোনো লেনদেন নেই। "+" চেপে এন্ট্রি দিন।</p>`;
}
const ST=[['Pending','জমা','bg-slate-200 text-slate-700'],['InProgress','চলছে','bg-amber-100 text-amber-700'],['Done','তৈরি','bg-emerald-100 text-emerald-700'],['Delivered','ডেলিভারি','bg-sky-100 text-sky-700']];
function rService(){
  const opts=[['all','সব']].concat(ST.map(s=>[s[0],s[1]]));
  $('svc-chips').innerHTML=opts.map(([k,l])=>`<button onclick="svcF='${k}';rService()" class="shrink-0 px-4 py-1.5 rounded-full text-sm font-medium ${svcF===k?'bg-brandSky text-white':'card text-slate-600 dark:text-slate-300'}">${l} <span class="text-xs opacity-70">${bn(S.Services.filter(r=>k==='all'||(r.Status||'Pending')===k).length)}</span></button>`).join('');
  const rows=S.Services.filter(r=>svcF==='all'||(r.Status||'Pending')===svcF).slice().reverse();
  $('svc').innerHTML=rows.length?rows.map(r=>{const si=Math.max(0,ST.findIndex(s=>s[0]===(r.Status||'Pending'))),st=ST[si],due=num(r.Charge)-num(r.Paid),nx=ST[si+1];
   return `<div class="card rounded-2xl p-3.5 shadow-sm"><div class="flex justify-between items-start gap-2"><div class="min-w-0"><p class="font-bold truncate">${esc(r.Device)}</p><p class="text-xs text-slate-500 truncate">${esc(r.Problem)}</p></div><span class="${st[2]} text-[11px] font-bold px-2 py-0.5 rounded-md shrink-0">${st[1]}</span></div>
   <p class="text-xs text-slate-500 mt-2"><i class="fa-regular fa-user mr-1"></i>${esc(r.Customer)} ${r.Phone?`· <a class="text-brandSky" href="tel:${esc(r.Phone)}">${esc(r.Phone)}</a>`:''} · ${esc(toKey(r.Date))}</p>
   <div class="flex items-center justify-between mt-2.5"><div class="text-sm"><b>${taka(r.Charge)}</b>${due>0?` <span class="text-red-500 text-xs">বাকি ${taka(due)}</span>`:' <span class="text-emerald-600 text-xs">পরিশোধিত</span>'}</div>
   <div class="flex gap-1.5">${due>0?`<button onclick="collect('Services','${r.ID}')" class="text-xs px-2.5 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 font-semibold">টাকা পেলাম</button>`:''}${nx?`<button onclick="setSt('${r.ID}','${nx[0]}')" class="text-xs px-2.5 py-1.5 rounded-lg bg-brandBlue text-white font-semibold">${nx[1]} →</button>`:''}</div></div></div>`}).join(''):`<p class="text-center text-slate-400 text-sm py-10 md:col-span-2">কোনো সার্ভিস জব নেই।</p>`;
}
function rStock(){
  const q=($('q').value||'').toLowerCase();
  $('tstock').textContent=bn(S.Products.reduce((s,p)=>s+num(p.Stock),0))+' পিস';
  const rows=S.Products.filter(p=>((p.Name||'')+' '+(p.Category||'')).toLowerCase().includes(q));
  $('stock').innerHTML=rows.length?rows.map(p=>{const s=num(p.Stock),low=s<=num(p.MinStock||5),cl=s<=0?'bg-red-100 text-red-600':low?'bg-amber-100 text-amber-700':'bg-blue-50 text-brandBlue';
   return `<div class="card rounded-2xl p-3 shadow-sm flex items-center gap-3"><span class="w-10 h-10 shrink-0 rounded-xl bg-sky-100 dark:bg-sky-500/20 text-brandSky flex items-center justify-center"><i class="fa-solid fa-box"></i></span><div class="flex-1 min-w-0"><p class="font-semibold text-sm truncate">${esc(p.Name)}</p><p class="text-[11px] text-slate-400 truncate">${esc(p.Category)} · ক্রয় ${taka(p.BuyPrice)}</p></div><div class="text-right"><p class="font-bold text-emerald-600 text-sm">${taka(p.SellPrice)}</p><span class="${cl} px-2 py-0.5 rounded-md text-[11px] font-bold">${bn(s)} পিস</span></div></div>`}).join(''):`<p class="text-center text-slate-400 text-sm py-10 md:col-span-2">কোনো প্রোডাক্ট নেই।</p>`;
}
function rReport(){
  const a=txs().filter(inP),sum=(k,f)=>a.filter(t=>t.k===k).reduce((s,t)=>s+t[f],0);
  const sp=sum('Sale','pr'),vp=sum('Service','pr'),inc=sum('Income','a'),ex=sum('Expense','a'),net=sp+vp+inc-ex;
  const c=[['মালামাল বিক্রি',sum('Sale','a'),'text-brandOrange'],['মালামাল লাভ',sp,'text-emerald-600'],['সার্ভিস আয়',sum('Service','a'),'text-brandSky'],['সার্ভিস লাভ',vp,'text-emerald-600'],['অন্য আয়',inc,'text-emerald-600'],['মোট ব্যয়',ex,'text-red-500'],['নিট লাভ',net,net>=0?'text-emerald-600':'text-red-500'],['মোট বাকি',txs().filter(t=>t.sh).reduce((s,t)=>s+Math.max(0,t.a-t.p),0),'text-red-500']];
  $('rep').innerHTML=c.map(([l,v,cl])=>`<div class="card rounded-2xl p-3.5 shadow-sm"><p class="text-xs text-slate-500">${l}</p><p class="text-xl font-bold mt-1 ${cl}">${taka(v)}</p></div>`).join('');
}

function rCharts(){
  if(!$('c-trend'))return;
  const all=txs(),now=new Date(),W=300,H=120,lb=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".5">${t}</text>`;
  const agg=(fn,keys)=>keys.map(k=>{let i=0,o=0;all.forEach(t=>{if(fn(t)===k)t.k==='Expense'?o+=t.a:i+=t.p});return{i,o}});
  const days=[...Array(7)].map((_,n)=>{const d=new Date(now);d.setDate(d.getDate()-6+n);return d}),dv=agg(t=>t.d,days.map(dkey));
  const mx=Math.max(1,...dv.flatMap(x=>[x.i,x.o])),pts=f=>dv.map((x,n)=>[10+n*(W-20)/6,H-18-x[f]/mx*(H-38)]);
  const sm=p=>p.map((q,n)=>n?`C${(p[n-1][0]+q[0])/2},${p[n-1][1]} ${(p[n-1][0]+q[0])/2},${q[1]} ${q[0]},${q[1]}`:`M${q[0]},${q[1]}`).join('');
  $('c-trend').innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="w-full"><path d="${sm(pts('i'))}" fill="none" stroke="#00A8E8" stroke-width="2.5" stroke-linecap="round"/><path d="${sm(pts('o'))}" fill="none" stroke="#F26522" stroke-width="2.5" stroke-linecap="round"/>${days.map((d,n)=>lb(10+n*(W-20)/6,H-3,d.toLocaleDateString('bn-BD',{weekday:'short'}))).join('')}</svg>`;
  const ms=[...Array(6)].map((_,n)=>new Date(now.getFullYear(),now.getMonth()-5+n,1)),mv=agg(t=>t.d.slice(0,7),ms.map(d=>dkey(d).slice(0,7))),mm=Math.max(1,...mv.flatMap(x=>[x.i,x.o])),bw=50;
  $('c-bars').innerHTML=`<svg viewBox="0 0 300 130" class="w-full">${mv.map((x,n)=>{const a=x.i/mm*95,b=x.o/mm*95,c=n*bw+bw/2;return `<rect x="${c-11}" y="${108-a}" width="9" height="${a}" rx="4.5" fill="#00A8E8"/><rect x="${c+2}" y="${108-b}" width="9" height="${b}" rx="4.5" fill="#F26522" opacity=".75"/>${lb(c,124,ms[n].toLocaleDateString('bn-BD',{month:'short'}))}`}).join('')}</svg>`;
  let i=0,o=0;all.filter(inP).forEach(t=>t.k==='Expense'?o+=t.a:i+=t.p);
  const R=44,C=2*Math.PI*R,f=i+o?i/(i+o):0;
  $('c-donut').innerHTML=`<svg viewBox="0 0 120 120" class="w-36 mx-auto -rotate-90"><circle cx="60" cy="60" r="${R}" fill="none" stroke="${i+o?'#F26522':'#cbd5e1'}" stroke-opacity=".75" stroke-width="10"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="#00A8E8" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><b>${taka(i-o)}</b><span class="text-[11px] text-slate-400">${PL[period]} নিট</span></div>`;
}

/* ---------- Actions ---------- */
function collect(sh,id){
  const f=sh==='Sales'?'Total':'Charge', r=S[sh].find(x=>String(x.ID)===String(id)); if(!r)return;
  r.Paid=num(r[f]);save();render();post({action:'update',sheet:sh,id,fields:{Paid:r.Paid}});toast('টাকা আদায় হয়েছে');later();
}
function setSt(id,s){const r=S.Services.find(x=>String(x.ID)===String(id));if(!r)return;r.Status=s;save();rService();post({action:'update',sheet:'Services',id,fields:{Status:s}});later()}

/* ---------- Forms ---------- */
const F={
 Sale:['মালামাল',[['Product','প্রোডাক্ট (তালিকা থেকে বা নিজে লিখুন)','text',1],['Qty','পরিমাণ','number',0,1],['UnitPrice','একক বিক্রয় মূল্য (৳)','number',1],['Customer','কাস্টমার (ঐচ্ছিক)','text'],['Paid','জমা (৳) – খালি = পুরো টাকা','number']]],
 Service:['সার্ভিস',[['Device','ডিভাইস / মডেল','text',1],['Problem','সমস্যা','text'],['Customer','কাস্টমারের নাম','text'],['Phone','ফোন','tel'],['Charge','সার্ভিস চার্জ (৳)','number',1],['PartsCost','পার্টস খরচ (৳)','number'],['Paid','অগ্রিম জমা (৳)','number']]],
 Expense:['ব্যয়',[['Category','খাত (যেমন: দোকান ভাড়া)','text',1],['Note','বিবরণ','text'],['Amount','টাকা (৳)','number',1]]],
 Income:['অন্য আয়',[['Category','খাত','text',1],['Note','বিবরণ','text'],['Amount','টাকা (৳)','number',1]]],
 Product:['প্রোডাক্ট',[['Name','নাম','text',1],['Category','ক্যাটাগরি','text'],['BuyPrice','ক্রয় মূল্য (৳)','number'],['SellPrice','বিক্রয় মূল্য (৳)','number',1],['Stock','স্টক (পিস)','number']]]
};
let cur='Sale';
function openSheet(t){
  cur=t||'Sale';
  $('seg').innerHTML=Object.keys(F).map(k=>`<button type="button" onclick="openSheet('${k}')" class="shrink-0 flex-1 px-3 py-2 rounded-lg font-medium ${k===cur?'bg-white dark:bg-slate-700 shadow text-brandBlue dark:text-white':'text-slate-500'}">${F[k][0]}</button>`).join('');
  $('form').innerHTML=F[cur][1].map(([k,l,ty,r,d])=>`<div><label class="block text-xs font-semibold text-slate-500 mb-1">${l}</label><input name="${k}" type="${ty}" ${ty==='number'?'inputmode="decimal" step="any"':''} ${k==='Product'?'autocomplete="off"':''} ${r?'required':''} ${d?'value="1"':''} class="w-full p-2.5 border border-slate-200 dark:border-slate-700 bg-transparent rounded-xl text-sm outline-none focus:ring-2 focus:ring-brandSky"></div>`).join('')+`<button class="w-full bg-brandSky text-white font-semibold py-3 rounded-xl shadow">সেভ করুন</button>`;
  if(cur==='Sale'){
    const f=$('form'),inp=f.elements.Product,w=inp.parentElement,box=document.createElement('div');
    w.classList.add('relative');inp.style.paddingRight='2rem';
    w.insertAdjacentHTML('beforeend','<i class="fa-solid fa-chevron-down absolute right-3 top-[2.1rem] text-xs text-slate-400 pointer-events-none"></i>');
    box.id='pdd';box.className='mt-1 max-h-48 overflow-y-auto rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800';w.appendChild(box);
    const pick=p=>{inp.value=p.Name;f.elements.UnitPrice.value=num(p.SellPrice)};
    const draw=()=>{const q=inp.value.trim().toLowerCase(),l=S.Products.filter(p=>!q||String(p.Name).toLowerCase().includes(q));
      box.innerHTML=l.length?l.map(p=>`<button type="button" data-i="${esc(p.ID)}" class="w-full text-left px-3 py-2 flex justify-between gap-3 hover:bg-sky-50 dark:hover:bg-slate-700 ${num(p.Stock)<=0?'opacity-50':''}"><span class="text-sm font-medium truncate">${esc(p.Name)}</span><span class="text-[11px] text-slate-500 shrink-0">${num(p.Stock)>0?'স্টক '+bn(p.Stock):'স্টক শেষ'} · ${taka(p.SellPrice)}</span></button>`).join(''):`<p class="px-3 py-3 text-xs text-slate-400">${S.Products.length?'তালিকায় নেই – নিজে লিখুন':'কোনো প্রোডাক্ট নেই – "প্রোডাক্ট" ট্যাব থেকে যোগ করুন'}</p>`;box.classList.remove('hidden')};
    inp.onfocus=draw;
    inp.oninput=()=>{draw();const p=S.Products.find(x=>String(x.Name).trim().toLowerCase()===inp.value.trim().toLowerCase());if(p)f.elements.UnitPrice.value=num(p.SellPrice)};
    box.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const p=S.Products.find(x=>String(x.ID)===b.dataset.i);if(p){pick(p);box.classList.add('hidden');f.elements.Qty.focus()}};
    draw();
  }
  $('bd').classList.remove('hidden');requestAnimationFrame(()=>$('sheet').classList.add('open'));
}
function closeSheet(){$('sheet').classList.remove('open');setTimeout(()=>$('bd').classList.add('hidden'),220)}
function submitForm(e){
  e.preventDefault();
  const v=Object.fromEntries(new FormData(e.target)),date=dkey(new Date()),T=Date.now();
  let sheet,row;
  if(cur==='Sale'){
    const p=S.Products.find(x=>String(x.Name).trim().toLowerCase()===String(v.Product).trim().toLowerCase()),q=num(v.Qty)||1,tot=q*num(v.UnitPrice),cost=p?q*num(p.BuyPrice):0;
    sheet='Sales';row={ID:'S-'+T,Date:date,ProductID:p?p.ID:'',ProductName:v.Product,Qty:q,UnitPrice:num(v.UnitPrice),Total:tot,BuyCost:cost,Profit:tot-cost,Customer:v.Customer,Paid:v.Paid===''?tot:num(v.Paid)};
    if(p)p.Stock=num(p.Stock)-q;
  }else if(cur==='Service'){
    sheet='Services';row={ID:'J-'+T,Date:date,Customer:v.Customer,Phone:v.Phone,Device:v.Device,Problem:v.Problem,Charge:num(v.Charge),PartsCost:num(v.PartsCost),Profit:num(v.Charge)-num(v.PartsCost),Status:'Pending',Paid:num(v.Paid)};
  }else if(cur==='Product'){
    sheet='Products';row={ID:'P-'+T,Name:v.Name,Category:v.Category,BuyPrice:num(v.BuyPrice),SellPrice:num(v.SellPrice),Stock:num(v.Stock),MinStock:5};
  }else{sheet='Ledger';row={ID:'L-'+T,Date:date,Type:cur,Category:v.Category,Note:v.Note,Amount:num(v.Amount)}}
  S[sheet].push(row);save();render();closeSheet();toast('ফোনে সেভ হয়েছে, Excel এ পাঠানো হচ্ছে…');
  post({action:'add',sheet,row});later();
}

/* ---------- Nav / UI ---------- */
document.addEventListener('click',e=>{const d=$('pdd');if(d&&!e.target.closest('#pdd')&&e.target.name!=='Product')d.classList.add('hidden')});
const NAV=[['home','হোম','fa-house'],['service','সার্ভিস','fa-screwdriver-wrench'],['fab'],['stock','স্টক','fa-boxes-stacked'],['report','রিপোর্ট','fa-chart-pie']];
$('navi').innerHTML=NAV.map(n=>n[0]==='fab'?`<div class="flex justify-center md:order-first md:mb-3"><button onclick="openSheet('Sale')" class="-mt-8 md:mt-0 w-14 h-14 md:w-full md:h-11 rounded-full md:rounded-xl bg-brandSky text-white shadow-lg shadow-sky-500/40 flex items-center justify-center gap-2 text-2xl md:text-sm md:font-semibold border-4 md:border-0 border-slate-50 dark:border-slate-900"><i class="fa-solid fa-plus"></i><span class="hidden md:inline">নতুন এন্ট্রি</span></button></div>`:`<button data-nav="${n[0]}" onclick="go('${n[0]}')" class="flex flex-col md:flex-row items-center md:gap-3 md:px-3 md:py-2.5 md:rounded-xl gap-0.5 text-xs md:text-sm text-slate-400"><i class="fa-solid ${n[2]} text-lg md:w-5"></i>${n[1]}</button>`).join('');
function go(v){view=v;['home','service','stock','report'].forEach(x=>$('v-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('[data-nav]').forEach(b=>{const on=b.dataset.nav===v;b.classList.toggle('text-brandSky',on);b.classList.toggle('md:bg-sky-50',on);b.classList.toggle('dark:md:bg-slate-700',on)});$('vt').textContent=({home:'ড্যাশবোর্ড',service:'সার্ভিস',stock:'স্টক',report:'রিপোর্ট'})[v];scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){period=b.dataset.p;ptabs();rHome();rReport();rCharts()}});
$('quick').innerHTML=[['Sale','fa-cart-shopping','bg-orange-100 dark:bg-orange-500/20 text-brandOrange','মালামাল'],['Service','fa-screwdriver-wrench','bg-sky-100 dark:bg-sky-500/20 text-brandSky','সার্ভিস'],['Income','fa-plus','bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600','অন্য আয়'],['Expense','fa-minus','bg-red-100 dark:bg-red-500/20 text-red-500','ব্যয়']].map(q=>`<button onclick="openSheet('${q[0]}')" class="card rounded-2xl py-3 shadow-sm flex flex-col items-center gap-1.5"><span class="w-10 h-10 rounded-full flex items-center justify-center ${q[2]}"><i class="fa-solid ${q[1]}"></i></span><span class="text-[11px] font-medium">${q[3]}</span></button>`).join('');
function dark(){const on=document.documentElement.classList.toggle('dark');$('dk').className='fa-solid text-sm '+(on?'fa-sun':'fa-moon');try{localStorage.setItem('at-dark',on?'1':'0')}catch(e){}}
try{if(localStorage.getItem('at-dark')==='1')dark()}catch(e){}

/* ---------- PWA ---------- */
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').classList.remove('hidden')});
$('install').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('install').classList.add('hidden')};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));

go('home');render();flush();fetchData();
setInterval(refresh,30000);setInterval(flush,10000);
document.addEventListener('visibilitychange',refresh);
addEventListener('online',refresh);
</script>
